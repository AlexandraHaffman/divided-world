<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Терминал: Глобус — Разделённый мир</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700&family=Russo+One&display=swap');

  /* Кириллица: Share Tech Mono её не содержит, поэтому в моноспейс-стек
     первым идёт Exo 2 — тот же техно-стиль, но буквы и цифры одной гарнитурой. */
  :root {
    --bg: #080c12;
    --blue: #4fc3f7;
    --text: #c8d8e8;
    --text-dim: #5a7a9a;
    --border: rgba(79,195,247,0.2);
    --font-display: 'Russo One', 'Exo 2', sans-serif;
    --font-ui: 'Exo 2', system-ui, sans-serif;
    --font-mono: 'Share Tech Mono', 'Exo 2', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    position: fixed;
    inset: 0;
  }

  #stage { position: absolute; inset: 0; }
  /* Звёздное небо рисуется ОДИН раз в 2D-канвас, а не считается шейдером
     на каждый пиксель каждый кадр — это снимает основную нагрузку с GPU. */
  #starfield, #glcanvas, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Слой меток перерисовывается ровно тогда же, когда и глобус, — на
     неподвижной карте он не стоит ничего. */
  #overlay { pointer-events: none; }
  #input {
    position: absolute; inset: 0;
    touch-action: none;
    cursor: grab;
  }
  #input.dragging { cursor: grabbing; }
  #input.pointing { cursor: pointer; }

  /* Панели намеренно без backdrop-filter: размытие заставляет браузер
     перекомпоновывать область на каждом кадре вращения глобуса. */

  /* ── НАВИГАЦИЯ ── */
  .back-link {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 20;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.1em;
    border: 1px solid rgba(79,195,247,0.3);
    padding: 5px 12px;
    border-radius: 3px;
    background: rgba(8,12,18,0.82);
    transition: color .2s, border-color .2s;
  }
  .back-link:hover { color: var(--blue); border-color: var(--blue); }

  /* ── МИНИ-ЛЕГЕНДА ── */
  .legend {
    position: absolute;
    left: 14px;
    bottom: 16px;
    z-index: 20;
    width: 186px;
    max-height: calc(100% - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(10,16,26,0.86);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .legend-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .legend.collapsed .legend-head { border-bottom: none; }
  .legend-head:hover .legend-title { color: var(--blue); }
  .legend-title {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 2.2px;
    color: var(--text-dim);
    transition: color .2s;
  }
  .legend-toggle { font-family: var(--font-mono); font-size: 11px; color: var(--blue); }
  .legend-body { overflow-y: auto; padding: 4px 0; }
  .legend.collapsed .legend-body { display: none; }
  .legend-body::-webkit-scrollbar { width: 3px; }
  .legend-body::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.3); }
  .l-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 11px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .15s;
  }
  .l-item:hover { background: rgba(79,195,247,0.07); }
  .l-item.active {
    background: color-mix(in srgb, var(--fc) 14%, transparent);
    border-left-color: var(--fc);
  }
  .l-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fc);
    box-shadow: 0 0 6px var(--fc);
    flex-shrink: 0;
  }
  .l-name {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--text);
    line-height: 1.2;
  }
  .l-item.active .l-name { color: #fff; }

  /* ── КРАТКАЯ СПРАВКА О ФРАКЦИИ ── */
  .fcard {
    position: absolute;
    right: 14px; top: 14px;
    z-index: 30;
    width: min(310px, calc(100vw - 28px));
    max-height: calc(100% - 28px);
    display: none;
    flex-direction: column;
    background: rgba(8,13,22,0.92);
    border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent);
    border-top: 2px solid var(--fc);
    border-radius: 3px;
  }
  .fcard.open { display: flex; }
  .fcard-body { overflow-y: auto; padding: 10px 12px 12px; }
  .fcard-body::-webkit-scrollbar { width: 3px; }
  .fcard-body::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fc) 40%, transparent); }
  .fcard-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-right: 20px;
    margin-bottom: 9px;
  }
  .fcard-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fc);
    box-shadow: 0 0 6px var(--fc);
    flex-shrink: 0;
  }
  .fcard-name {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 1.2px;
    color: var(--fc);
    text-transform: uppercase;
    line-height: 1.25;
  }
  .fcard-close {
    position: absolute;
    right: 5px; top: 5px;
    z-index: 2;
    width: 22px; height: 22px;
    background: rgba(4,8,14,0.7);
    border: none;
    border-radius: 3px;
    color: var(--fc);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: .8;
  }
  .fcard-close:hover { opacity: 1; }
  .fcard-ideo { font-size: 11.5px; line-height: 1.5; color: var(--text); }
  .fc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .fc-stat {
    background: rgba(2,4,9,0.7);
    border-radius: 3px;
    padding: 6px 8px;
  }
  .fc-stat-label {
    font-family: var(--font-mono);
    font-size: 7px;
    letter-spacing: 1.3px;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .fc-stat-value { font-size: 12px; font-weight: 600; line-height: 1.25; color: #fff; }
  .fc-note { font-size: 10px; line-height: 1.4; color: var(--text-dim); margin: -4px 0 8px; padding-left: 3px; }
  .fc-meter {
    position: relative;
    height: 6px;
    background: rgba(2,4,9,0.85);
    border: 1px solid color-mix(in srgb, var(--fc) 35%, transparent);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 5px;
  }
  .fc-meter-fill { height: 100%; background: var(--fc); box-shadow: 0 0 6px var(--fc); }
  .fc-meter-label { font-size: 11.5px; color: var(--text); }
  .fc-meter-label b { font-family: var(--font-mono); color: var(--fc); font-weight: 700; }
  .fc-empty { font-size: 11.5px; line-height: 1.5; color: var(--text-dim); }

  /* ── КАРТОЧКА ЛОКАЦИИ ── */
  .loccard {
    position: absolute;
    right: 14px; top: 14px;
    z-index: 30;
    width: min(310px, calc(100vw - 28px));
    max-height: calc(100% - 28px);
    display: none;
    flex-direction: column;
    background: rgba(8,13,22,0.94);
    border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent);
    border-top: 2px solid var(--fc);
    border-radius: 3px;
  }
  .loccard.open { display: flex; }
  .lc-close {
    position: absolute;
    right: 5px; top: 5px;
    z-index: 2;
    width: 22px; height: 22px;
    background: rgba(4,8,14,0.7);
    border: none;
    border-radius: 3px;
    color: var(--fc);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: .8;
  }
  .lc-close:hover { opacity: 1; }
  .lc-body { overflow-y: auto; padding: 10px 12px 12px; }
  .lc-body::-webkit-scrollbar { width: 3px; }
  .lc-body::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fc) 40%, transparent); }
  .lc-shots {
    display: flex;
    gap: 4px;
    width: calc(100% + 24px);
    margin: -10px -12px 9px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
  }
  .lc-shots::-webkit-scrollbar { height: 3px; }
  .lc-shots::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fc) 40%, transparent); }
  .lc-photo {
    flex: 0 0 100%;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: rgba(2,4,9,0.8);
    scroll-snap-align: start;
  }
  .lc-name {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 1.2px;
    color: var(--fc);
    text-transform: uppercase;
    line-height: 1.25;
    padding-right: 22px;
    margin-bottom: 6px;
  }
  .lc-badges { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .lc-type, .lc-region {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1.6px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(2,4,9,0.85);
  }
  .lc-type { color: var(--fc); border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent); }
  .lc-type.war { color: #ff5544; border-color: rgba(255,85,68,0.5); }
  .lc-region { color: var(--text-dim); }
  .lc-sub {
    font-size: 11.5px;
    font-weight: 600;
    color: #fff;
    line-height: 1.35;
    background: rgba(2,4,9,0.7);
    border-radius: 3px;
    padding: 5px 8px;
    margin-bottom: 8px;
  }
  .lc-desc { font-size: 12px; line-height: 1.5; margin-bottom: 9px; }
  .lc-full { margin-bottom: 9px; }
  .lc-full summary {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 1.8px;
    color: var(--fc);
    cursor: pointer;
    padding: 5px 8px;
    background: rgba(2,4,9,0.85);
    border-left: 2px solid var(--fc);
    border-radius: 3px;
    list-style: none;
  }
  .lc-full summary::-webkit-details-marker { display: none; }
  .lc-full summary::before { content: '\25b8  '; }
  .lc-full[open] summary::before { content: '\25be  '; }
  .lc-full p { font-size: 11.5px; line-height: 1.55; margin: 7px 2px 0; }
  .lc-row { margin-bottom: 8px; }
  .lc-label {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1.6px;
    color: var(--fc);
    border-left: 2px solid var(--fc);
    padding: 2px 7px;
    background: rgba(2,4,9,0.85);
    border-radius: 3px;
    margin-bottom: 3px;
  }
  .lc-value { font-size: 12px; line-height: 1.4; padding-left: 3px; }
  .lc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .lc-chip {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid color-mix(in srgb, var(--fc) 50%, transparent);
    color: var(--fc);
    background: rgba(2,4,9,0.7);
  }
  .lc-child {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    margin-bottom: 4px;
    background: rgba(2,4,9,0.8);
    border-left: 2px solid var(--fc);
    border-radius: 3px;
    cursor: pointer;
  }
  .lc-child:hover { background: color-mix(in srgb, var(--fc) 12%, rgba(2,4,9,0.8)); }
  .lc-child-type { font-family: var(--font-mono); font-size: 7.5px; color: var(--fc); flex-shrink: 0; }
  .lc-child-name { font-size: 11.5px; font-weight: 600; }
  .lc-back {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.6px;
    color: var(--fc);
    background: rgba(2,4,9,0.85);
    border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 9px;
  }

  /* ── МАСШТАБНАЯ ЛИНЕЙКА ── */
  .scalebar {
    position: absolute;
    right: 14px;
    bottom: 18px;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .scale-rule {
    position: relative;
    height: 7px;
    border: 1px solid rgba(79,195,247,0.55);
    border-top: none;
    transition: width .12s;
  }
  .scale-km {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--blue);
    opacity: .8;
  }
  .scale-alt {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 1.2px;
    color: var(--text-dim);
  }
  .scale-alt b { color: var(--blue); font-weight: 400; }

  /* ── ЗАГРУЗКА ── */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background:
      linear-gradient(rgba(8,12,18,0.72), rgba(8,12,18,0.9)),
      url('../data/images/backgrounds/bg-map.webp') center/cover no-repeat,
      var(--bg);
    transition: opacity .8s;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .load-text {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--blue);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  .load-ring {
    width: 46px; height: 46px;
    border: 1px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }


  @media (max-width: 700px) {
    .legend { width: 158px; }
    .l-name { font-size: 10.5px; }
    .fcard { left: 10px; right: 10px; top: auto; bottom: 74px; width: auto; max-height: 58%; }
    .loccard { left: 10px; right: 10px; top: auto; bottom: 74px; width: auto; max-height: 58%; }
    .scalebar { bottom: 14px; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="starfield"></canvas>
  <canvas id="glcanvas"></canvas>
  <canvas id="overlay"></canvas>
  <div id="input"></div>
</div>

<a class="back-link" href="../index.html">← ТЕРМИНАЛ</a>

<div class="legend" id="legend">
  <div class="legend-head" id="legendHead">
    <div class="legend-title">РЕЕСТР ФРАКЦИЙ</div>
    <div class="legend-toggle" id="legendToggle">–</div>
  </div>
  <div class="legend-body" id="legendBody"></div>
</div>

<div class="fcard" id="fcard">
  <button class="fcard-close" id="fcClose" aria-label="Закрыть">×</button>
  <div class="fcard-body" id="fcBody"></div>
</div>

<div class="loccard" id="loccard">
  <button class="lc-close" id="lcClose" aria-label="Закрыть">×</button>
  <div class="lc-body" id="lcBody"></div>
</div>

<div class="scalebar">
  <div class="scale-km" id="scaleKm"></div>
  <div class="scale-rule" id="scaleRule"></div>
  <div class="scale-alt">ВЫСОТА НАД ОКЕАНОМ <b id="scaleAltValue">—</b></div>
</div>

<div id="loader">
  <div class="load-ring"></div>
  <div class="load-text">INITIALIZING ORBITAL GRID…</div>
</div>

<script src="data/land.js"></script>
<script src="data/factions.js"></script>
<script src="data/factions-geo.js"></script>
<script src="data/locations.js"></script>
<script>
(function(){
"use strict";

// Текст фракций правится руками в factions.js, очертания собираются скриптом
// в factions-geo.js. Здесь они соединяются по ключу.
const FAC_GEO  = window.FACTIONS_GEO || {};
const FACTIONS = (window.FACTIONS_INFO || []).map(f => ({ ...f, polys: FAC_GEO[f.key] || [] }));
const LAND     = window.LAND_DATA;   // [ [внешнее кольцо, дыра...], ... ], кольцо = [[lat,lon],...]
const DEG = Math.PI / 180;
const R_EARTH = 6371;                // км

// ═══════════════ ГЕОМЕТРИЯ ═══════════════
// Долготы в данных уже непрерывны: куски по антимеридиану сшиты при сборке
// (Евразия честно уходит за 180°), поэтому разворачивать ничего не нужно.
function bounds(poly){
  let loMin = Infinity, loMax = -Infinity, laMin = Infinity, laMax = -Infinity;
  for (const ring of poly){
    for (let i = 0; i < ring.length; i++){
      const la = ring[i][0], lo = ring[i][1];
      if (lo < loMin) loMin = lo;
      if (lo > loMax) loMax = lo;
      if (la < laMin) laMin = la;
      if (la > laMax) laMax = la;
    }
  }
  return { loMin, loMax, laMin, laMax };
}
const LAND_BB = LAND.map(bounds);
const FAC_BB = FACTIONS.map(f => (f.polys || []).map(bounds));

function pointInRing(lat, lon, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if ((yi > lat) !== (yj > lat) &&
        lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// точка внутри внешнего кольца и снаружи всех дыр
function pointInPoly(lat, lon, poly){
  if (!pointInRing(lat, lon, poly[0])) return false;
  for (let i = 1; i < poly.length; i++){
    if (pointInRing(lat, lon, poly[i])) return false;
  }
  return true;
}
function factionAt(lat, lon){
  for (let fi = 0; fi < FACTIONS.length; fi++){
    const polys = FACTIONS[fi].polys || [];
    for (let pi = 0; pi < polys.length; pi++){
      const bb = FAC_BB[fi][pi];
      if (lat < bb.laMin || lat > bb.laMax) continue;
      for (const off of [-360, 0, 360]){
        const L = lon + off;
        if (L < bb.loMin || L > bb.loMax) continue;
        if (pointInPoly(lat, L, polys[pi])) return FACTIONS[fi];
      }
    }
  }
  return null;
}

// ═══════════════ ОТРИСОВКА КАРТЫ В ТЕКСТУРУ ═══════════════
// Одна и та же функция рисует и общую текстуру всего мира, и «детальную»
// текстуру только видимого окна — отличается лишь охват (rect).
function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function paintMap(c, W, H, rect, selectedKey, lineK){
  const loMin  = rect ? rect.loMin  : -180;
  const loSpan = rect ? rect.loSpan : 360;
  const laMin  = rect ? rect.laMin  : -90;
  const laSpan = rect ? rect.laSpan : 180;
  const X = lon => (lon - loMin) / loSpan * W;
  const Y = lat => (laMin + laSpan - lat) / laSpan * H;
  // Толщина штрихов. По умолчанию она привязана к градусам — это верно для
  // общей текстуры, которую видно издалека. Для детального окна вызывающий
  // передаёт свой lineK: там ширина должна держаться постоянной НА ЭКРАНЕ,
  // иначе при приближении граница растёт вместе с картой и превращается
  // в ленту шириной в сотни километров (в ней целиком тонул Кипр).
  const k = lineK != null ? lineK : (W / loSpan) / (4096 / 360);
  const WORLD_DX = 360 / loSpan * W;

  const og = c.createLinearGradient(0, Y(90), 0, Y(-90));
  og.addColorStop(0.00, '#040a12');
  og.addColorStop(0.42, '#0a1826');
  og.addColorStop(0.58, '#0a1826');
  og.addColorStop(1.00, '#040a12');
  c.fillStyle = og;
  c.fillRect(0, 0, W, H);

  // Градусная сетка
  c.strokeStyle = 'rgba(90,150,255,0.055)';
  c.lineWidth = Math.max(1, k);
  for (let lo = -180; lo < 180; lo += 15){
    for (const dx of [-WORLD_DX, 0, WORLD_DX]){
      const x = X(lo) + dx;
      if (x < -2 || x > W + 2) continue;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    }
  }
  for (let la = -75; la <= 75; la += 15){
    const y = Y(la);
    if (y < -2 || y > H + 2) continue;
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  c.strokeStyle = 'rgba(90,170,255,0.10)';
  if (Y(0) >= -2 && Y(0) <= H + 2){
    c.beginPath(); c.moveTo(0, Y(0)); c.lineTo(W, Y(0)); c.stroke();
  }

  // Копии со сдвигом нужны только полигонам, реально попадающим в кадр.
  // Здесь же происходит отсев: для детального окна почти весь мир отпадает.
  function offsetsFor(bb){
    if (bb.laMax < laMin || bb.laMin > laMin + laSpan) return null;
    let out = null;
    for (const dx of [-WORLD_DX, 0, WORLD_DX]){
      if (X(bb.loMax) + dx >= 0 && X(bb.loMin) + dx <= W) (out = out || []).push(dx);
    }
    return out;
  }
  // Полигон целиком (внешнее кольцо + дыры) одним путём —
  // заливка по evenodd честно прорезает Каспий и прочие внутренние моря.
  function tracePoly(poly, dx){
    c.beginPath();
    for (const ring of poly){
      for (let i = 0; i < ring.length; i++){
        const x = X(ring[i][1]) + dx, y = Y(ring[i][0]);
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath();
    }
  }

  const landDraw = [];
  for (let i = 0; i < LAND.length; i++){
    const offs = offsetsFor(LAND_BB[i]);
    if (offs) landDraw.push([LAND[i], offs]);
  }
  const eachLand = fn => { for (const [poly, offs] of landDraw) for (const dx of offs) fn(poly, dx); };

  // Суша
  c.fillStyle = '#152219';
  eachLand((poly, dx) => { tracePoly(poly, dx); c.fill('evenodd'); });

  // Свечение берега: вместо ctx.shadowBlur (дорогой программный блюр) —
  // три обводки нарастающей толщины.
  c.save();
  c.strokeStyle = 'rgba(90,190,230,0.55)';
  c.globalAlpha = 0.12; c.lineWidth = 6 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.globalAlpha = 0.22; c.lineWidth = 3 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.strokeStyle = 'rgba(120,205,180,0.30)';
  c.globalAlpha = 1; c.lineWidth = 1.6 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.restore();

  // Территории фракций: сначала все заливки, потом все границы
  const hasSel = !!selectedKey;
  const facDraw = [];
  for (let fi = 0; fi < FACTIONS.length; fi++){
    const polys = FACTIONS[fi].polys || [];
    for (let pi = 0; pi < polys.length; pi++){
      const offs = offsetsFor(FAC_BB[fi][pi]);
      if (offs) facDraw.push([FACTIONS[fi], polys[pi], offs]);
    }
  }
  for (const [f, poly, offs] of facDraw){
    const [r, g, b] = hexRgb(f.col);
    const sel = f.key === selectedKey;
    c.fillStyle = `rgba(${r},${g},${b},${sel ? 0.38 : (hasSel ? 0.10 : 0.20)})`;
    for (const dx of offs){ tracePoly(poly, dx); c.fill('evenodd'); }
  }
  // Ширина свечения — в градусах. Раньше она была такой, что ореол шириной
  // ~100 км съедал мелкие острова целиком (Кипр превращался в кинжал).
  for (const [f, poly, offs] of facDraw){
    const sel = f.key === selectedKey;
    const baseA = sel ? 1 : (hasSel ? 0.55 : 0.9);
    c.save();
    c.strokeStyle = f.col;
    c.globalAlpha = baseA * 0.10; c.lineWidth = (sel ? 12 : 6) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.globalAlpha = baseA * 0.24; c.lineWidth = (sel ? 6 : 3.4) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.globalAlpha = baseA; c.lineWidth = (sel ? 3.6 : 2) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.restore();
  }
}

const texCanvas = document.createElement('canvas');
const detCanvas = document.createElement('canvas');
let texSize = 4096;
let detMax = 4096;               // потолок стороны детального окна
const DET_MAX_TEXELS = 8e6;      // и потолок по площади, чтобы не съесть память
// Ширина самой толстой обводки границы на экране (в CSS-пикселях) и то,
// какому коэффициенту в коде она соответствует.
const BORDER_MAX_PX = 5;
const BORDER_REF_UNITS = 6;

function buildTexture(selectedKey){
  texCanvas.width = texSize; texCanvas.height = texSize / 2;
  paintMap(texCanvas.getContext('2d'), texSize, texSize / 2, null, selectedKey);
}

// ═══════════════ ЗВЁЗДНОЕ НЕБО (статичное, рисуется один раз) ═══════════════
const starCanvas = document.getElementById('starfield');
function drawStarfield(w, h, dpr){
  starCanvas.width = w * dpr; starCanvas.height = h * dpr;
  const c = starCanvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const neb = c.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.85);
  neb.addColorStop(0, '#0a0d1a');
  neb.addColorStop(1, '#03030c');
  c.fillStyle = neb;
  c.fillRect(0, 0, w, h);

  // детерминированный ГПСЧ — звёзды не «перепрыгивают» при ресайзе
  let seed = 20610412;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  const count = Math.round(w * h / 2600);
  for (let i = 0; i < count; i++){
    const x = rnd() * w, y = rnd() * h;
    const m = rnd();
    const r = m > 0.985 ? 1.5 : m > 0.9 ? 1.0 : 0.65;
    const a = 0.25 + rnd() * 0.6;
    c.globalAlpha = a;
    c.fillStyle = m > 0.96 ? '#dce8ff' : '#9fb6d8';
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    if (r > 1.2){
      c.globalAlpha = a * 0.18;
      c.beginPath(); c.arc(x, y, r * 3.2, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
}

// ═══════════════ WEBGL ═══════════════
const glCanvas = document.getElementById('glcanvas');
const gl = glCanvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false })
        || glCanvas.getContext('experimental-webgl', { alpha: true });

const VSH = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// Шейдер считает только диск планеты и ореол вокруг него; всё остальное
// отбрасывается (звёзды лежат отдельным статичным слоем снизу).
const FSH = `
precision highp float;
uniform vec3  uView;      // cx, cy (GL-координаты), R в px
uniform mat3  uMinv;      // view -> world
uniform sampler2D uTex;   // текстура всего мира
uniform sampler2D uDet;   // детальная текстура видимого окна
uniform vec4  uDetRect;   // loMin, laMin, loSpan, laSpan (градусы)
uniform float uDetOn;

const float R2D = 57.29577951;

void main(){
  vec2 q = (gl_FragCoord.xy - uView.xy) / uView.z;
  float d = length(q);
  float aa = 1.6 / uView.z;

  vec3  atm  = vec3(0.22, 0.52, 1.0);
  float halo = exp(-max(d - 1.0, 0.0) * 7.5) * 0.34;

  if (d < 1.0 + aa){
    float z = sqrt(max(1.0 - d * d, 0.0));
    vec3 n = vec3(q, z);
    vec3 w = uMinv * n;
    float lon = atan(w.x, w.z);
    float pol = acos(clamp(w.y, -1.0, 1.0));
    vec3 tex = texture2D(uTex, vec2(lon / 6.28318530718 + 0.5, pol / 3.14159265359)).rgb;

    // Вблизи общая текстура не тянет по разрешению, поэтому поверх неё
    // подмешивается окно, отрисованное только для видимого участка.
    if (uDetOn > 0.5){
      float loD = lon * R2D;
      float laD = 90.0 - pol * R2D;
      float dl = mod(loD - uDetRect.x + 540.0, 360.0) - 180.0;
      vec2 duv = vec2(dl / uDetRect.z, (uDetRect.y + uDetRect.w - laD) / uDetRect.w);
      vec2 e = min(duv, 1.0 - duv);
      float m = step(0.0, e.x) * step(0.0, e.y) * smoothstep(0.0, 0.035, min(e.x, e.y));
      tex = mix(tex, texture2D(uDet, duv).rgb, m);
    }

    // мягкий свет + лимбовое затемнение
    vec3 L = normalize(vec3(-0.42, 0.34, 0.84));
    float diff = 0.72 + 0.40 * max(dot(n, L), 0.0);
    float rim = pow(1.0 - z, 3.0);
    vec3 col = tex * diff + atm * rim * 0.38;

    float m2 = smoothstep(1.0 + aa, 1.0 - aa, d);
    gl_FragColor = vec4(mix(atm, col, m2), max(m2, halo));
  } else {
    if (halo < 0.004) discard;
    gl_FragColor = vec4(atm, halo);
  }
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

let prog, uni = {}, tex, detTex;
function initGL(){
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  for (const name of ['uView','uMinv','uTex','uDet','uDetRect','uDetOn'])
    uni[name] = gl.getUniformLocation(prog, name);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.uniform1i(uni.uTex, 0);

  // Детальная текстура работает только на приближении, там всегда растяжение,
  // а не сжатие — мипмапы ей не нужны, и мы экономим на их построении.
  detTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, detTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.uniform1i(uni.uDet, 1);
  gl.uniform1f(uni.uDetOn, 0);
  gl.activeTexture(gl.TEXTURE0);
}

function uploadTexture(){
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  const ext = gl.getExtension('EXT_texture_filter_anisotropic');
  if (ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT,
    Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
}

// ═══════════════ СОСТОЯНИЕ КАМЕРЫ ═══════════════
const inputEl = document.getElementById('input');
const dpr = Math.min(window.devicePixelRatio || 1, 2);

let W = 0, H = 0;             // CSS-пиксели
let ry = 0.55, rx = 0.42;     // текущие углы
let ty = 0.55, tx = 0.42;     // целевые углы
let R = 100, tR = 100;        // радиус глобуса, px
let baseR = 100;
let autoRot = true;
let vy = 0, vx = 0;           // инерция
let dirty = true;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  glCanvas.width = W * dpr; glCanvas.height = H * dpr;
  overlay.width = W * dpr; overlay.height = H * dpr;
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  drawStarfield(W, H, dpr);
  const nb = Math.min(W, H) * 0.40;
  if (baseR === 100){ R = tR = nb; }
  baseR = nb;
  detRect = null;
  dirty = true;
}
window.addEventListener('resize', resize);

// view = M · world;  M = Rx(rx) · Ry(ry)
function viewMatrix(){
  const ca = Math.cos(ry), sa = Math.sin(ry);
  const cb = Math.cos(rx), sb = Math.sin(rx);
  return {
    r1: [ca, 0, sa],
    r2: [sb * sa, cb, -sb * ca],
    r3: [-cb * sa, sb, cb * ca],
  };
}
// обратная проекция: экран -> lat/lon (null вне сферы)
function unproject(mx, my, M){
  const qx = (mx - W/2) / R, qy = -(my - H/2) / R;
  const d2 = qx*qx + qy*qy;
  if (d2 > 1) return null;
  const qz = Math.sqrt(1 - d2);
  const wx = M.r1[0]*qx + M.r2[0]*qy + M.r3[0]*qz;
  const wy = M.r1[1]*qx + M.r2[1]*qy + M.r3[1]*qz;
  const wz = M.r1[2]*qx + M.r2[2]*qy + M.r3[2]*qz;
  return { lat: Math.asin(Math.max(-1, Math.min(1, wy))) / DEG, lon: Math.atan2(wx, wz) / DEG };
}

// ═══════════════ ДЕТАЛЬНАЯ ТЕКСТУРА ═══════════════
// Одна текстура на весь глобус не может быть резкой на сильном приближении:
// 4096 px на 360° — это ~10 км в пикселе. Поэтому вблизи поверх неё кладётся
// окно, отрисованное только для видимого участка, — то же качество, но
// в десяток раз плотнее. Пересобирается только когда вид устоялся.
let detRect = null;
let detBusy = false;

function detailWanted(){ return R > baseR * 1.6; }

function detailSpan(){
  const halfDiag = 0.5 * Math.hypot(W, H);
  const halfAng = Math.asin(Math.min(1, halfDiag / R)) / DEG;
  return Math.min(160, Math.max(3, halfAng * 2 * 1.25));
}

function detailStale(){
  if (!detailWanted()) return !!detRect;
  const ll = unproject(W/2, H/2, viewMatrix());
  if (!ll) return false;
  if (!detRect) return true;
  const span = detailSpan();
  if (Math.abs(span - detRect.laSpan) > detRect.laSpan * 0.3) return true;
  let dlo = ll.lon - detRect.loC;
  dlo = ((dlo + 540) % 360) - 180;
  if (Math.abs(dlo) > detRect.loSpan * 0.18) return true;
  if (Math.abs(ll.lat - detRect.laC) > detRect.laSpan * 0.18) return true;
  return false;
}

function updateDetail(){
  if (detBusy) return;
  if (!detailWanted()){
    if (detRect){ detRect = null; gl.uniform1f(uni.uDetOn, 0); dirty = true; }
    return;
  }
  const ll = unproject(W/2, H/2, viewMatrix());
  if (!ll) return;
  detBusy = true;

  const laSpan = detailSpan();
  // у полюсов та же картинка занимает куда больше градусов долготы
  const loSpan = Math.min(170, laSpan / Math.max(0.18, Math.cos(ll.lat * DEG)));
  const rect = {
    loMin: ll.lon - loSpan / 2, loSpan,
    laMin: Math.max(-90, Math.min(90 - laSpan, ll.lat - laSpan / 2)), laSpan,
    loC: ll.lon, laC: ll.lat,
  };

  // Размер окна берём ровно под плотность экрана — примерно 1,25 текселя
  // на пиксель устройства. Больше не нужно (не станет резче), меньше — мыло.
  const aspect = laSpan / loSpan;
  let w = Math.ceil(loSpan * R * dpr / 57.2958 * 1.25);
  w = Math.max(512, Math.min(detMax, w));
  if (w * w * aspect > DET_MAX_TEXELS) w = Math.floor(Math.sqrt(DET_MAX_TEXELS / aspect));
  const h = Math.max(256, Math.round(w * aspect));

  // текселей в одном экранном пикселе -> из этого считаем толщину границ
  const texelPerPx = w * 57.2958 / (loSpan * R);
  const kDeg = (w / loSpan) / (4096 / 360);
  const lineK = Math.min(kDeg, BORDER_MAX_PX * texelPerPx / BORDER_REF_UNITS);

  detCanvas.width = w; detCanvas.height = h;
  paintMap(detCanvas.getContext('2d'), w, h, rect, selectedKey, lineK);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, detTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, detCanvas);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform4f(uni.uDetRect, rect.loMin, rect.laMin, rect.loSpan, rect.laSpan);
  gl.uniform1f(uni.uDetOn, 1);

  detRect = rect;
  detBusy = false;
  dirty = true;
}

const INFLUENCE_MAX = 15;   // шкала влияния из справочника фракций, 1-15

// Досье фракции: столица и статистика — короткими карточками, влияние —
// шкалой (не числом в тексте), лидеры — отдельными фигурами, а не
// перечислением через запятую. У фракций без единого командования
// (Белая зона) все поля пустые — вместо досье показывается пояснение.
function facCardHtml(f){
  let h = `<div class="fcard-head"><div class="fcard-dot"></div><div class="fcard-name">${esc(f.name)}</div></div>`;
  if (f.capital){
    h += `<div class="lc-row"><div class="lc-label">СТОЛИЦА</div><div class="lc-value">${esc(f.capital)}</div></div>`;
  }
  if (f.population || f.area){
    h += '<div class="fc-stats">';
    if (f.population) h += `<div class="fc-stat"><div class="fc-stat-label">НАСЕЛЕНИЕ</div><div class="fc-stat-value">${esc(f.population)}</div></div>`;
    if (f.area) h += `<div class="fc-stat"><div class="fc-stat-label">ПЛОЩАДЬ</div><div class="fc-stat-value">${esc(f.area)}</div></div>`;
    h += '</div>';
  }
  if (f.areaNote) h += `<div class="fc-note">${esc(f.areaNote)}</div>`;
  if (f.influence){
    const pct = Math.max(0, Math.min(100, f.influence / INFLUENCE_MAX * 100));
    h += `<div class="lc-row"><div class="lc-label">ВЛИЯНИЕ</div>
      <div class="fc-meter"><div class="fc-meter-fill" style="width:${pct}%"></div></div>
      <div class="fc-meter-label"><b>${f.influence}</b>${f.tier ? ' — ' + esc(f.tier) : ''}</div></div>`;
  }
  if (f.leader){
    const names = f.leader.split(/,\s*/).filter(Boolean);
    h += `<div class="lc-row"><div class="lc-label">${names.length > 1 ? 'ЛИДЕРЫ' : 'ЛИДЕР'}</div><div class="lc-chips">${
      names.map(n => `<span class="lc-chip">${esc(n)}</span>`).join('')}</div></div>`;
  }
  if (f.ideo) h += `<div class="fcard-ideo">${esc(f.ideo)}</div>`;
  if (!f.capital && !f.population && !f.area && !f.influence && !f.leader && !f.ideo){
    h += '<div class="fc-empty">Досье не составлено — территория не имеет задокументированного центрального управления.</div>';
  }
  return h;
}

function openCard(f){
  fcard.style.setProperty('--fc', f.col);
  document.getElementById('fcBody').innerHTML = facCardHtml(f);
  fcard.classList.add('open');
}

function shortestAngle(from, to){
  let d = (to - from) % (2 * Math.PI);
  if (d >  Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return from + d;
}
function flyToLL(lat, lon, minZoom){
  ty = shortestAngle(ry, -lon * DEG);
  tx = Math.max(-1.35, Math.min(1.35, lat * DEG));
  if (minZoom && tR < minZoom) tR = minZoom;
  autoRot = false;
  dirty = true;
}

function refreshTexture(key){
  if (refreshTexture._last === key) return;
  refreshTexture._last = key;
  buildTexture(key);
  uploadTexture();
  detRect = null;   // детальное окно тоже устарело
  dirty = true;
}

function select(key, fly){
  const f = key ? FACTIONS.find(x => x.key === key) : null;
  selectedKey = f ? key : null;
  legendBody.querySelectorAll('.l-item').forEach(el =>
    el.classList.toggle('active', el.dataset.key === selectedKey));
  if (f){
    closeLoc();
    openCard(f);
    if (fly) flyToLL(f.clat, f.clon, baseR * 1.5);
  } else {
    fcard.classList.remove('open');
  }
  refreshTexture(selectedKey);
}

// ═══════════════ МАСШТАБНАЯ ЛИНЕЙКА ═══════════════
const scaleKm = document.getElementById('scaleKm');
const scaleRule = document.getElementById('scaleRule');
const altValue = document.getElementById('scaleAltValue');
const FOV_HALF = 22.5 * DEG;   // условный полуугол обзора «камеры»

function fmtKm(km){
  return km >= 1000 ? (km / 1000).toFixed(km >= 10000 ? 0 : 1).replace('.', ',') + ' ТЫС КМ'
                    : Math.round(km) + ' КМ';
}
function updateScale(){
  // Проекция ортографическая, поэтому «высота» — это то удаление, с которого
  // Земля видна под тем же углом при полуугле обзора FOV_HALF.
  const ang = Math.atan2(R * Math.tan(FOV_HALF), H / 2);
  const alt = Math.max(0, R_EARTH / Math.sin(ang) - R_EARTH);

  const kmPerPx = R_EARTH / R;   // в центре диска
  let best = 100;
  for (const km of [10, 25, 50, 100, 200, 300, 500, 1000, 2000, 3000, 5000, 10000]){
    best = km;
    if (km / kmPerPx >= 60) break;
  }
  scaleRule.style.width = Math.round(best / kmPerPx) + 'px';
  scaleKm.textContent = fmtKm(best);
  altValue.textContent = fmtKm(alt);
}

// ═══════════════ ЛОКАЦИИ ═══════════════
// Метки живут на отдельном 2D-слое поверх глобуса и перерисовываются ровно
// тогда же, когда и сам глобус: на неподвижной карте слой не стоит ничего.
const LOCATIONS = (window.LOCATIONS_DATA || []).map((l, i) => ({ ...l, id: 'loc' + i }));

const TYPE_RU = {
  capital: 'СТОЛИЦА', regional_capital: 'ЦЕНТР РЕГИОНА', city: 'ГОРОД',
  base: 'БАЗА', settlement: 'ПОСЕЛЕНИЕ', landmark: 'ОБЪЕКТ',
  anomaly: 'АНОМАЛИЯ', frontline: 'ЛИНИЯ ФРОНТА', zone: 'ЗОНА',
};
const TYPE_SIZE = {
  capital: 5.2, regional_capital: 4.2, city: 3.4, base: 3.4,
  settlement: 2.7, landmark: 4, anomaly: 4, frontline: 4, zone: 4.2,
};
// приоритет подписи при нехватке места: меньше — важнее
const TYPE_PRIO = {
  capital: 0, frontline: 1, landmark: 2, regional_capital: 3,
  base: 4, city: 5, anomaly: 5, zone: 2, settlement: 6,
};
// строки досье: поле -> подпись. Показываются только заполненные.
const LOC_FIELDS = [
  ['region', 'Регион'], ['population', 'Население'], ['founded', 'Основание'],
  ['management', 'Управление'], ['economy', 'Экономика'], ['defense', 'Оборона'],
  ['capacity', 'Вместимость'], ['danger', 'Уровень опасности'],
  ['status', 'Статус'], ['intensity', 'Интенсивность'], ['purpose', 'Назначение'],
];
const PHOTO_DIR = '../data/images/locations/';
const NEUTRAL = { key: '', col: '#8fa8c0', name: '' };
const facOf = key => FACTIONS.find(f => f.key === key) || NEUTRAL;

const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');

function projectLL(lat, lon, M, lift){
  const la = lat * DEG, lo = lon * DEG, c = Math.cos(la);
  const h = lift || 1;
  const x = c * Math.sin(lo) * h, y = Math.sin(la) * h, z = c * Math.cos(lo) * h;
  const vx = M.r1[0]*x + M.r1[1]*y + M.r1[2]*z;
  const vy = M.r2[0]*x + M.r2[1]*y + M.r2[2]*z;
  const vz = M.r3[0]*x + M.r3[1]*y + M.r3[2]*z;
  return { x: W/2 + vx * R, y: H/2 - vy * R, vis: vz > 0.015 };
}

// Свечение — заранее просчитанным спрайтом, а не ctx.shadowBlur:
// программный блюр на каждую метку каждый кадр съедал бы весь выигрыш.
const glowCache = new Map();
function glowSprite(col){
  let s = glowCache.get(col);
  if (s) return s;
  const SZ = 64;
  s = document.createElement('canvas');
  s.width = s.height = SZ;
  const g = s.getContext('2d');
  const grad = g.createRadialGradient(SZ/2, SZ/2, 0, SZ/2, SZ/2, SZ/2);
  grad.addColorStop(0, col + 'ff');
  grad.addColorStop(0.32, col + '4d');
  grad.addColorStop(1, col + '00');
  g.fillStyle = grad;
  g.fillRect(0, 0, SZ, SZ);
  glowCache.set(col, s);
  return s;
}
function drawGlow(x, y, r, col, a){
  if (a <= 0.02 || r <= 0) return;
  octx.globalAlpha = a;
  octx.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
}

function smooth01(x){ return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

let labelRects = [];
function labelFits(x, y, w, h){
  for (const r of labelRects){
    if (x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y) return false;
  }
  labelRects.push({ x, y, w, h });
  return true;
}

function drawMarker(loc, x, y, col, hot, a){
  const sz = (TYPE_SIZE[loc.type] || 3.4) * (hot ? 1.35 : 1);
  const t = loc.type;
  if (t === 'frontline'){
    const fl = '#ff3322';
    drawGlow(x, y, sz + (hot ? 13 : 8), '#ff5500', a * 0.85);
    octx.globalAlpha = a;
    octx.fillStyle = fl;
    octx.beginPath(); octx.arc(x, y, sz, 0, Math.PI * 2); octx.fill();
    octx.globalAlpha = a * 0.45;
    octx.strokeStyle = fl; octx.lineWidth = 1;
    octx.beginPath(); octx.arc(x, y, sz + 4, 0, Math.PI * 2); octx.stroke();
    return sz;
  }
  drawGlow(x, y, sz + (hot ? 12 : 7), col, a * 0.8);
  octx.globalAlpha = a;
  octx.fillStyle = col;
  if (t === 'base'){
    const s = sz * 0.85;
    octx.fillRect(x - s, y - s, s * 2, s * 2);
  } else if (t === 'landmark' || t === 'anomaly' || t === 'zone'){
    octx.beginPath();
    octx.moveTo(x, y - sz); octx.lineTo(x + sz * 0.8, y);
    octx.lineTo(x, y + sz);  octx.lineTo(x - sz * 0.8, y);
    octx.closePath(); octx.fill();
  } else {
    octx.beginPath(); octx.arc(x, y, sz, 0, Math.PI * 2); octx.fill();
  }
  if (t === 'capital'){
    octx.globalAlpha = a * 0.5;
    octx.strokeStyle = col; octx.lineWidth = 1;
    octx.beginPath(); octx.arc(x, y, sz + 4, 0, Math.PI * 2); octx.stroke();
  }
  return sz;
}

// шрифт подписей читаем из CSS один раз: getComputedStyle на каждую подпись
// каждый кадр — это синхронный пересчёт стилей, и он дороже самой отрисовки
const LABEL_FONT = (getComputedStyle(document.documentElement)
  .getPropertyValue('--font-mono') || 'monospace').trim();

function drawLabel(text, x, y, off, col, hot, a, big){
  if (a <= 0.05) return;
  const fs = big ? 11.5 : 10;
  octx.save();
  octx.font = (hot ? '700 ' : '500 ') + fs + 'px ' + LABEL_FONT;
  octx.textAlign = 'center';
  octx.textBaseline = 'top';
  const tw = octx.measureText(text).width;
  const py = y + off;
  if (!hot && !labelFits(x - tw/2 - 4, py - 2, tw + 8, fs + 5)){ octx.restore(); return; }
  octx.globalAlpha = 0.8 * a;
  octx.fillStyle = 'rgba(4,7,14,0.9)';
  octx.fillRect(x - tw/2 - 4, py - 2, tw + 8, fs + 5);
  octx.globalAlpha = a;
  octx.fillStyle = hot ? '#ffffff' : col;
  octx.fillText(text, x, py);
  octx.restore();
}

// порядок обхода: важные подписи занимают место первыми
const LOC_ORDER = [...LOCATIONS].sort((a, b) => (TYPE_PRIO[a.type] ?? 9) - (TYPE_PRIO[b.type] ?? 9));

function drawOverlay(M){
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, W, H);
  labelRects = [];
  for (const l of LOCATIONS) l._sx = null;

  // Пока глобус виден целиком, меток нет вовсе — карта остаётся чистой.
  // Дальше они проявляются по мере приближения: сначала крупные, потом все.
  const z = R / baseR;
  const aMain = smooth01((z - 1.15) / 0.35);
  const aAll  = smooth01((z - 1.75) / 0.5);
  const lMain = smooth01((z - 1.5) / 0.4);
  const lAll  = smooth01((z - 2.2) / 0.5);
  if (aMain <= 0.02) return;

  for (const loc of LOC_ORDER){
    const main = (TYPE_PRIO[loc.type] ?? 9) <= 3;
    const a = main ? aMain : aAll;
    if (a <= 0.02) continue;
    const f = facOf(loc.faction);
    const p = projectLL(loc.lat, loc.lon, M, loc.float ? 1.04 : 1);
    if (!p.vis) continue;
    loc._sx = p.x; loc._sy = p.y;

    if (loc.float){
      const g = projectLL(loc.lat, loc.lon, M, 1);
      if (g.vis){
        octx.save();
        octx.globalAlpha = 0.35 * a;
        octx.strokeStyle = f.col;
        octx.setLineDash([2, 3]);
        octx.lineWidth = 0.8;
        octx.beginPath(); octx.moveTo(g.x, g.y); octx.lineTo(p.x, p.y); octx.stroke();
        octx.restore();
      }
    }

    const hot = selectedLocId === loc.id;
    const sz = drawMarker(loc, p.x, p.y, f.col, hot, a);
    const la = (main ? lMain : lAll) * (hot ? 1 : 0.9);
    drawLabel(loc.name, p.x, p.y, sz + 5,
      loc.type === 'frontline' ? '#ff6655' : f.col, hot, la, main);
  }
  octx.globalAlpha = 1;
}

// ═══════════════ КАРТОЧКА ЛОКАЦИИ ═══════════════
const loccard = document.getElementById('loccard');
const lcBody = document.getElementById('lcBody');
let selectedLocId = null;
document.getElementById('lcClose').addEventListener('click', () => closeLoc());

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function locCardHtml(loc, parent){
  const f = facOf(loc.faction);
  let h = '';
  // фотографий может быть несколько: photos: ["a.webp", "b.webp"].
  // Одиночное photo тоже понимаем — так писались первые локации.
  const shots = loc.photos && loc.photos.length ? loc.photos : (loc.photo ? [loc.photo] : []);
  if (shots.length){
    h += '<div class="lc-shots">' + shots.map(src =>
      `<img class="lc-photo" src="${PHOTO_DIR}${encodeURIComponent(src)}" alt="" loading="lazy" onerror="this.remove()">`
    ).join('') + '</div>';
  }
  if (parent) h += `<div class="lc-back" data-back="1">◄ ${esc(parent.name)}</div>`;
  h += `<div class="lc-name">${esc(loc.name)}</div>`;
  h += `<div class="lc-badges"><span class="lc-type${loc.type === 'frontline' ? ' war' : ''}">${TYPE_RU[loc.type] || 'ОБЪЕКТ'}</span>`;
  if (f.name) h += `<span class="lc-region">${esc(f.name)}</span>`;
  h += `</div>`;
  if (loc.subtitle) h += `<div class="lc-sub">${esc(loc.subtitle)}</div>`;
  if (loc.desc) h += `<div class="lc-desc">${esc(loc.desc)}</div>`;
  if (loc.full){
    const paras = String(loc.full).split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
    h += `<details class="lc-full"><summary>ПОЛНОЕ ДОСЬЕ</summary>${paras}</details>`;
  }
  for (const [key, label] of LOC_FIELDS){
    if (!loc[key]) continue;
    h += `<div class="lc-row"><div class="lc-label">${label.toUpperCase()}</div><div class="lc-value">${esc(loc[key])}</div></div>`;
  }
  for (const [key, label] of [['involved','СТОРОНЫ'], ['chars','КЛЮЧЕВЫЕ ФИГУРЫ']]){
    if (!loc[key] || !loc[key].length) continue;
    h += `<div class="lc-row"><div class="lc-label">${label}</div><div class="lc-chips">${
      loc[key].map(n => `<span class="lc-chip">${esc(n)}</span>`).join('')}</div></div>`;
  }
  if (loc.children && loc.children.length){
    h += `<div class="lc-row"><div class="lc-label">ОБЪЕКТЫ ВНУТРИ</div>${
      loc.children.map((c, i) => `<div class="lc-child" data-child="${i}">
        <span class="lc-child-type">${TYPE_RU[c.type] || 'ОБЪЕКТ'}</span>
        <span class="lc-child-name">${esc(c.name)}</span></div>`).join('')}</div>`;
  }
  return h;
}

function showLocCard(loc, parent){
  const f = facOf(loc.faction);
  loccard.style.setProperty('--fc', f.col);
  lcBody.innerHTML = locCardHtml(loc, parent);
  lcBody.scrollTop = 0;
  lcBody.querySelectorAll('[data-child]').forEach(el =>
    el.addEventListener('click', () => showLocCard(loc.children[+el.dataset.child], loc)));
  const back = lcBody.querySelector('[data-back]');
  if (back && parent) back.addEventListener('click', () => showLocCard(parent));
  loccard.classList.add('open');
}

function selectLocation(loc){
  selectedLocId = loc.id;
  fcard.classList.remove('open');
  showLocCard(loc, null);
  dirty = true;
}
function closeLoc(){
  selectedLocId = null;
  loccard.classList.remove('open');
  dirty = true;
}

// поиск метки под курсором по экранным позициям последнего кадра
function locationAt(mx, my){
  let best = null, bd = 18;
  for (const loc of LOCATIONS){
    if (loc._sx == null) continue;
    const d = Math.hypot(mx - loc._sx, my - loc._sy);
    if (d < bd){ bd = d; best = loc; }
  }
  return best;
}

// ═══════════════ ГЛАВНЫЙ ЦИКЛ ═══════════════
// Кадр рисуется, только когда что-то реально меняется: на статичном глобусе
// GPU простаивает вместо того, чтобы бесконечно перерисовывать одно и то же.
function animating(){
  return autoRot
      || Math.abs(vy) > 1e-5 || Math.abs(vx) > 1e-5
      || Math.abs(ty - ry) > 1e-4 || Math.abs(tx - rx) > 1e-4
      || Math.abs(tR - R)  > 0.05;
}

function frame(){
  if (autoRot) ty += 0.0032;
  if (Math.abs(vy) > 1e-5 || Math.abs(vx) > 1e-5){
    ty += vy; tx += vx;
    vy *= 0.94; vx *= 0.94;
    tx = Math.max(-1.35, Math.min(1.35, tx));
  }
  ry += (ty - ry) * 0.09;
  rx += (tx - rx) * 0.09;
  R  += (tR - R) * 0.12;

  const moving = animating();
  if (dirty || moving){
    const M = viewMatrix();
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform3f(uni.uView, W/2 * dpr, glCanvas.height - H/2 * dpr, R * dpr);
    // uMinv = M^T, column-major => столбцы = строки M
    gl.uniformMatrix3fv(uni.uMinv, false, new Float32Array([
      M.r1[0], M.r1[1], M.r1[2],
      M.r2[0], M.r2[1], M.r2[2],
      M.r3[0], M.r3[1], M.r3[2],
    ]));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    drawOverlay(M);
    updateScale();
    dirty = false;
  }
  // детальное окно пересобираем только когда вид устоялся,
  // иначе на каждом кадре перетаскивания шла бы полная перерисовка
  if (!moving && !dragging && detailStale()) updateDetail();
  requestAnimationFrame(frame);
}

// ═══════════════ ВВОД ═══════════════
const pointers = new Map();
let dragging = false, dragDist = 0, lastX = 0, lastY = 0, pinch0 = 0, pinchR0 = 0;
let lastMoveT = 0, lastDX = 0, lastDY = 0;

function speed(){ return 0.0048 * Math.min(W, H) / R; }
function clampR(r){ return Math.max(baseR * 0.45, Math.min(baseR * 9, r)); }

inputEl.addEventListener('pointerdown', e => {
  inputEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){
    dragging = true; dragDist = 0;
    lastX = e.clientX; lastY = e.clientY;
    vy = vx = 0;
    autoRot = false;
    inputEl.classList.add('dragging');
  } else if (pointers.size === 2){
    const pts = [...pointers.values()];
    pinch0 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchR0 = tR;
    dragging = false;
  }
  dirty = true;
});

inputEl.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinch0 > 0) tR = clampR(pinchR0 * d / pinch0);
    dirty = true;
    return;
  }
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const sp = speed();
    ty += dx * sp; tx += dy * sp;
    tx = Math.max(-1.35, Math.min(1.35, tx));
    dragDist += Math.abs(dx) + Math.abs(dy);
    lastDX = dx * sp; lastDY = dy * sp; lastMoveT = performance.now();
    lastX = e.clientX; lastY = e.clientY;
    dirty = true;
    return;
  }
  if (pointers.size === 0 && e.pointerType === 'mouse'){
    const rect = inputEl.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ll = unproject(mx, my, viewMatrix());
    inputEl.classList.toggle('pointing', !!(locationAt(mx, my) || (ll && factionAt(ll.lat, ll.lon))));
  }
});

inputEl.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (dragging && pointers.size === 0){
    dragging = false;
    inputEl.classList.remove('dragging');
    if (performance.now() - lastMoveT < 60 && dragDist > 6){ vy = lastDX; vx = lastDY; }
    if (dragDist < 6){
      const rect = inputEl.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const loc = locationAt(mx, my);
      if (loc){
        selectLocation(loc);
      } else {
        closeLoc();
        const ll = unproject(mx, my, viewMatrix());
        const f = ll ? factionAt(ll.lat, ll.lon) : null;
        select(f ? f.key : null, false);
      }
    }
  }
  if (pointers.size < 2) pinch0 = 0;
  dirty = true;
});
inputEl.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  dragging = false;
  inputEl.classList.remove('dragging');
});

inputEl.addEventListener('wheel', e => {
  e.preventDefault();
  tR = clampR(tR * (e.deltaY > 0 ? 0.9 : 1.11));
  dirty = true;
}, { passive: false });

// ═══════════════ СТАРТ ═══════════════
function start(){
  if (!gl){
    document.querySelector('.load-text').textContent = 'ERROR: WEBGL UNAVAILABLE';
    return;
  }
  initGL();
  resize();
  R = tR = baseR;
  // Считаем в ФИЗИЧЕСКИХ пикселях: у телефона ширина в CSS-пикселях ~390,
  // но плотность втрое выше, и текстура на 2048 давала заметное мыло.
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
  const shortPx = Math.min(screen.width, screen.height) * (window.devicePixelRatio || 1);
  texSize = Math.min(shortPx < 700 ? 2048 : 4096, maxTex);
  detMax = Math.min(4096, maxTex);
  buildTexture(null);
  uploadTexture();
  updateScale();
  requestAnimationFrame(frame);
  const loader = document.getElementById('loader');
  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 900);
}

start();

})();
</script>
</body>
</html>
