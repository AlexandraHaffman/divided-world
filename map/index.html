<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Терминал: Глобус — Разделённый мир</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700&family=Russo+One&display=swap');

  /* Кириллица: Share Tech Mono её не содержит, поэтому в моноспейс-стек
     первым идёт Exo 2 — тот же техно-стиль, но буквы и цифры одной гарнитурой. */
  :root {
    --bg: #080c12;
    --blue: #4fc3f7;
    --text: #c8d8e8;
    --text-dim: #5a7a9a;
    --border: rgba(79,195,247,0.2);
    --font-display: 'Russo One', 'Exo 2', sans-serif;
    --font-ui: 'Exo 2', system-ui, sans-serif;
    --font-mono: 'Share Tech Mono', 'Exo 2', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    position: fixed;
    inset: 0;
  }

  #stage { position: absolute; inset: 0; }
  /* Звёздное небо рисуется ОДИН раз в 2D-канвас, а не считается шейдером
     на каждый пиксель каждый кадр — это снимает основную нагрузку с GPU. */
  #starfield, #glcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #input {
    position: absolute; inset: 0;
    touch-action: none;
    cursor: grab;
  }
  #input.dragging { cursor: grabbing; }
  #input.pointing { cursor: pointer; }

  /* Панели намеренно без backdrop-filter: размытие заставляет браузер
     перекомпоновывать область на каждом кадре вращения глобуса. */

  /* ── НАВИГАЦИЯ ── */
  .back-link {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 20;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.1em;
    border: 1px solid rgba(79,195,247,0.3);
    padding: 5px 12px;
    border-radius: 3px;
    background: rgba(8,12,18,0.82);
    transition: color .2s, border-color .2s;
  }
  .back-link:hover { color: var(--blue); border-color: var(--blue); }

  /* ── МИНИ-ЛЕГЕНДА ── */
  .legend {
    position: absolute;
    left: 14px;
    bottom: 16px;
    z-index: 20;
    width: 186px;
    max-height: calc(100% - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(10,16,26,0.86);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .legend-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .legend.collapsed .legend-head { border-bottom: none; }
  .legend-head:hover .legend-title { color: var(--blue); }
  .legend-title {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 2.2px;
    color: var(--text-dim);
    transition: color .2s;
  }
  .legend-toggle { font-family: var(--font-mono); font-size: 11px; color: var(--blue); }
  .legend-body { overflow-y: auto; padding: 4px 0; }
  .legend.collapsed .legend-body { display: none; }
  .legend-body::-webkit-scrollbar { width: 3px; }
  .legend-body::-webkit-scrollbar-thumb { background: rgba(79,195,247,0.3); }
  .l-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 11px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .15s;
  }
  .l-item:hover { background: rgba(79,195,247,0.07); }
  .l-item.active {
    background: color-mix(in srgb, var(--fc) 14%, transparent);
    border-left-color: var(--fc);
  }
  .l-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fc);
    box-shadow: 0 0 6px var(--fc);
    flex-shrink: 0;
  }
  .l-name {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--text);
    line-height: 1.2;
  }
  .l-item.active .l-name { color: #fff; }

  /* ── КРАТКАЯ СПРАВКА О ФРАКЦИИ ── */
  .fcard {
    position: absolute;
    right: 14px; top: 14px;
    z-index: 30;
    width: min(266px, calc(100vw - 28px));
    display: none;
    background: rgba(8,13,22,0.92);
    border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent);
    border-top: 2px solid var(--fc);
    border-radius: 3px;
    padding: 10px 12px 12px;
  }
  .fcard.open { display: block; }
  .fcard-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-right: 18px;
    margin-bottom: 7px;
  }
  .fcard-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fc);
    box-shadow: 0 0 6px var(--fc);
    flex-shrink: 0;
  }
  .fcard-name {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1.2px;
    color: var(--fc);
    text-transform: uppercase;
    line-height: 1.25;
  }
  .fcard-close {
    position: absolute;
    right: 6px; top: 6px;
    width: 20px; height: 20px;
    background: none;
    border: none;
    color: var(--fc);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: .75;
  }
  .fcard-close:hover { opacity: 1; }
  .fcard-lead {
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1.6px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .fcard-leader { font-size: 12px; color: var(--text); margin-bottom: 7px; line-height: 1.3; }
  .fcard-ideo { font-size: 11.5px; line-height: 1.45; color: var(--text); }

  /* ── МАСШТАБНАЯ ЛИНЕЙКА ── */
  .scalebar {
    position: absolute;
    right: 14px;
    bottom: 18px;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .scale-rule {
    position: relative;
    height: 7px;
    border: 1px solid rgba(79,195,247,0.55);
    border-top: none;
    transition: width .12s;
  }
  .scale-km {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--blue);
    opacity: .8;
  }
  .scale-alt {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 1.2px;
    color: var(--text-dim);
  }
  .scale-alt b { color: var(--blue); font-weight: 400; }

  /* ── ЗАГРУЗКА ── */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background:
      linear-gradient(rgba(8,12,18,0.72), rgba(8,12,18,0.9)),
      url('../data/images/backgrounds/bg-map.webp') center/cover no-repeat,
      var(--bg);
    transition: opacity .8s;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .load-text {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--blue);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  .load-ring {
    width: 46px; height: 46px;
    border: 1px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ВОРОТА ДОСТУПА ── */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(20,32,52,0.6), transparent 60%),
      linear-gradient(rgba(8,12,18,0.75), rgba(8,12,18,0.92)),
      url('../data/images/backgrounds/bg-map.webp') center/cover no-repeat,
      var(--bg);
    transition: opacity .35s;
  }
  #gate.ok { opacity: 0; pointer-events: none; }
  .gate-box {
    position: relative;
    width: min(400px, calc(100vw - 40px));
    padding: 34px 28px 28px;
    background: rgba(10,16,26,0.92);
    border: 1px solid var(--border);
    border-top: 2px solid var(--blue);
    box-shadow: 0 0 40px rgba(79,195,247,0.14), inset 0 0 24px rgba(79,195,247,0.05);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    text-align: center;
  }
  #gate.shake .gate-box { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-9px); }
    40%,80% { transform: translateX(9px); }
  }
  .gate-icon { font-size: 30px; margin-bottom: 14px; filter: drop-shadow(0 0 12px rgba(79,195,247,0.5)); }
  .gate-title {
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px rgba(79,195,247,0.4);
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .gate-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  #gateForm { display: flex; flex-direction: column; gap: 12px; }
  #gateInput {
    width: 100%;
    background: rgba(2,4,9,0.85);
    border: 1px solid var(--border);
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 4px;
    text-align: center;
    padding: 13px 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #gateInput:focus { border-color: var(--blue); box-shadow: 0 0 14px rgba(79,195,247,0.25); }
  #gateBtn {
    background: rgba(79,195,247,0.1);
    border: 1px solid var(--blue);
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: all .2s;
  }
  #gateBtn:hover { background: rgba(79,195,247,0.2); box-shadow: 0 0 16px rgba(79,195,247,0.3); }
  .gate-err {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: #ff5544;
    min-height: 14px;
    margin-top: 14px;
    text-transform: uppercase;
  }
  .gate-back {
    position: absolute;
    top: 16px; left: 18px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-decoration: none;
    z-index: 201;
  }
  .gate-back:hover { color: var(--blue); }

  @media (max-width: 700px) {
    .legend { width: 158px; }
    .l-name { font-size: 10.5px; }
    .fcard { left: 10px; right: 10px; top: auto; bottom: 74px; width: auto; }
    .scalebar { bottom: 14px; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="starfield"></canvas>
  <canvas id="glcanvas"></canvas>
  <div id="input"></div>
</div>

<a class="back-link" href="../index.html">← ТЕРМИНАЛ</a>

<div class="legend" id="legend">
  <div class="legend-head" id="legendHead">
    <div class="legend-title">РЕЕСТР ФРАКЦИЙ</div>
    <div class="legend-toggle" id="legendToggle">–</div>
  </div>
  <div class="legend-body" id="legendBody"></div>
</div>

<div class="fcard" id="fcard">
  <button class="fcard-close" id="fcClose" aria-label="Закрыть">×</button>
  <div class="fcard-head">
    <div class="fcard-dot"></div>
    <div class="fcard-name" id="fcName"></div>
  </div>
  <div class="fcard-lead" id="fcLead">ЛИДЕР</div>
  <div class="fcard-leader" id="fcLeader"></div>
  <div class="fcard-ideo" id="fcIdeo"></div>
</div>

<div class="scalebar">
  <div class="scale-km" id="scaleKm"></div>
  <div class="scale-rule" id="scaleRule"></div>
  <div class="scale-alt">ВЫСОТА НАД ОКЕАНОМ <b id="scaleAltValue">—</b></div>
</div>

<div id="loader">
  <div class="load-ring"></div>
  <div class="load-text">INITIALIZING ORBITAL GRID…</div>
</div>

<div id="gate">
  <a class="gate-back" href="../index.html">← ТЕРМИНАЛ</a>
  <div class="gate-box">
    <div class="gate-icon">🔒</div>
    <div class="gate-title">ДОСТУП К СТРАНИЦЕ ОГРАНИЧЕН</div>
    <div class="gate-sub">Введите код доступа</div>
    <form id="gateForm" autocomplete="off">
      <input id="gateInput" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="• • • • • • •" aria-label="Код доступа">
      <button id="gateBtn" type="submit">Подтвердить</button>
    </form>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<script src="data/land.js"></script>
<script src="data/factions.js"></script>
<script>
(function(){
"use strict";

const FACTIONS = window.FACTIONS_DATA;
const LAND     = window.LAND_DATA;   // [ [внешнее кольцо, дыра...], ... ], кольцо = [[lat,lon],...]
const DEG = Math.PI / 180;
const R_EARTH = 6371;                // км

// ═══════════════ ГЕОМЕТРИЯ ═══════════════
// Долготы в данных уже непрерывны: куски по антимеридиану сшиты при сборке
// (Евразия честно уходит за 180°), поэтому разворачивать ничего не нужно.
function bounds(poly){
  let loMin = Infinity, loMax = -Infinity, laMin = Infinity, laMax = -Infinity;
  for (const ring of poly){
    for (let i = 0; i < ring.length; i++){
      const la = ring[i][0], lo = ring[i][1];
      if (lo < loMin) loMin = lo;
      if (lo > loMax) loMax = lo;
      if (la < laMin) laMin = la;
      if (la > laMax) laMax = la;
    }
  }
  return { loMin, loMax, laMin, laMax };
}
const LAND_BB = LAND.map(bounds);
const FAC_BB = FACTIONS.map(f => (f.polys || []).map(bounds));

function pointInRing(lat, lon, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if ((yi > lat) !== (yj > lat) &&
        lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// точка внутри внешнего кольца и снаружи всех дыр
function pointInPoly(lat, lon, poly){
  if (!pointInRing(lat, lon, poly[0])) return false;
  for (let i = 1; i < poly.length; i++){
    if (pointInRing(lat, lon, poly[i])) return false;
  }
  return true;
}
function factionAt(lat, lon){
  for (let fi = 0; fi < FACTIONS.length; fi++){
    const polys = FACTIONS[fi].polys || [];
    for (let pi = 0; pi < polys.length; pi++){
      const bb = FAC_BB[fi][pi];
      if (lat < bb.laMin || lat > bb.laMax) continue;
      for (const off of [-360, 0, 360]){
        const L = lon + off;
        if (L < bb.loMin || L > bb.loMax) continue;
        if (pointInPoly(lat, L, polys[pi])) return FACTIONS[fi];
      }
    }
  }
  return null;
}

// ═══════════════ ОТРИСОВКА КАРТЫ В ТЕКСТУРУ ═══════════════
// Одна и та же функция рисует и общую текстуру всего мира, и «детальную»
// текстуру только видимого окна — отличается лишь охват (rect).
function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function paintMap(c, W, H, rect, selectedKey){
  const loMin  = rect ? rect.loMin  : -180;
  const loSpan = rect ? rect.loSpan : 360;
  const laMin  = rect ? rect.laMin  : -90;
  const laSpan = rect ? rect.laSpan : 180;
  const X = lon => (lon - loMin) / loSpan * W;
  const Y = lat => (laMin + laSpan - lat) / laSpan * H;
  // штрихи задаём в градусах, а не в пикселях: тогда при переходе на детальную
  // текстуру толщина границ на экране не прыгает
  const k = (W / loSpan) / (4096 / 360);
  const WORLD_DX = 360 / loSpan * W;

  const og = c.createLinearGradient(0, Y(90), 0, Y(-90));
  og.addColorStop(0.00, '#040a12');
  og.addColorStop(0.42, '#0a1826');
  og.addColorStop(0.58, '#0a1826');
  og.addColorStop(1.00, '#040a12');
  c.fillStyle = og;
  c.fillRect(0, 0, W, H);

  // Градусная сетка
  c.strokeStyle = 'rgba(90,150,255,0.055)';
  c.lineWidth = Math.max(1, k);
  for (let lo = -180; lo < 180; lo += 15){
    for (const dx of [-WORLD_DX, 0, WORLD_DX]){
      const x = X(lo) + dx;
      if (x < -2 || x > W + 2) continue;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    }
  }
  for (let la = -75; la <= 75; la += 15){
    const y = Y(la);
    if (y < -2 || y > H + 2) continue;
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  c.strokeStyle = 'rgba(90,170,255,0.10)';
  if (Y(0) >= -2 && Y(0) <= H + 2){
    c.beginPath(); c.moveTo(0, Y(0)); c.lineTo(W, Y(0)); c.stroke();
  }

  // Копии со сдвигом нужны только полигонам, реально попадающим в кадр.
  // Здесь же происходит отсев: для детального окна почти весь мир отпадает.
  function offsetsFor(bb){
    if (bb.laMax < laMin || bb.laMin > laMin + laSpan) return null;
    let out = null;
    for (const dx of [-WORLD_DX, 0, WORLD_DX]){
      if (X(bb.loMax) + dx >= 0 && X(bb.loMin) + dx <= W) (out = out || []).push(dx);
    }
    return out;
  }
  // Полигон целиком (внешнее кольцо + дыры) одним путём —
  // заливка по evenodd честно прорезает Каспий и прочие внутренние моря.
  function tracePoly(poly, dx){
    c.beginPath();
    for (const ring of poly){
      for (let i = 0; i < ring.length; i++){
        const x = X(ring[i][1]) + dx, y = Y(ring[i][0]);
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath();
    }
  }

  const landDraw = [];
  for (let i = 0; i < LAND.length; i++){
    const offs = offsetsFor(LAND_BB[i]);
    if (offs) landDraw.push([LAND[i], offs]);
  }
  const eachLand = fn => { for (const [poly, offs] of landDraw) for (const dx of offs) fn(poly, dx); };

  // Суша
  c.fillStyle = '#152219';
  eachLand((poly, dx) => { tracePoly(poly, dx); c.fill('evenodd'); });

  // Свечение берега: вместо ctx.shadowBlur (дорогой программный блюр) —
  // три обводки нарастающей толщины.
  c.save();
  c.strokeStyle = 'rgba(90,190,230,0.55)';
  c.globalAlpha = 0.12; c.lineWidth = 6 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.globalAlpha = 0.22; c.lineWidth = 3 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.strokeStyle = 'rgba(120,205,180,0.30)';
  c.globalAlpha = 1; c.lineWidth = 1.6 * k;
  eachLand((poly, dx) => { tracePoly(poly, dx); c.stroke(); });
  c.restore();

  // Территории фракций: сначала все заливки, потом все границы
  const hasSel = !!selectedKey;
  const facDraw = [];
  for (let fi = 0; fi < FACTIONS.length; fi++){
    const polys = FACTIONS[fi].polys || [];
    for (let pi = 0; pi < polys.length; pi++){
      const offs = offsetsFor(FAC_BB[fi][pi]);
      if (offs) facDraw.push([FACTIONS[fi], polys[pi], offs]);
    }
  }
  for (const [f, poly, offs] of facDraw){
    const [r, g, b] = hexRgb(f.col);
    const sel = f.key === selectedKey;
    c.fillStyle = `rgba(${r},${g},${b},${sel ? 0.38 : (hasSel ? 0.10 : 0.20)})`;
    for (const dx of offs){ tracePoly(poly, dx); c.fill('evenodd'); }
  }
  // Ширина свечения — в градусах. Раньше она была такой, что ореол шириной
  // ~100 км съедал мелкие острова целиком (Кипр превращался в кинжал).
  for (const [f, poly, offs] of facDraw){
    const sel = f.key === selectedKey;
    const baseA = sel ? 1 : (hasSel ? 0.55 : 0.9);
    c.save();
    c.strokeStyle = f.col;
    c.globalAlpha = baseA * 0.10; c.lineWidth = (sel ? 12 : 6) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.globalAlpha = baseA * 0.24; c.lineWidth = (sel ? 6 : 3.4) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.globalAlpha = baseA; c.lineWidth = (sel ? 3.6 : 2) * k;
    for (const dx of offs){ tracePoly(poly, dx); c.stroke(); }
    c.restore();
  }
}

const texCanvas = document.createElement('canvas');
const detCanvas = document.createElement('canvas');
let texSize = 4096;
const DET_SIZE = 2048;

function buildTexture(selectedKey){
  texCanvas.width = texSize; texCanvas.height = texSize / 2;
  paintMap(texCanvas.getContext('2d'), texSize, texSize / 2, null, selectedKey);
}

// ═══════════════ ЗВЁЗДНОЕ НЕБО (статичное, рисуется один раз) ═══════════════
const starCanvas = document.getElementById('starfield');
function drawStarfield(w, h, dpr){
  starCanvas.width = w * dpr; starCanvas.height = h * dpr;
  const c = starCanvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const neb = c.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.85);
  neb.addColorStop(0, '#0a0d1a');
  neb.addColorStop(1, '#03030c');
  c.fillStyle = neb;
  c.fillRect(0, 0, w, h);

  // детерминированный ГПСЧ — звёзды не «перепрыгивают» при ресайзе
  let seed = 20610412;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  const count = Math.round(w * h / 2600);
  for (let i = 0; i < count; i++){
    const x = rnd() * w, y = rnd() * h;
    const m = rnd();
    const r = m > 0.985 ? 1.5 : m > 0.9 ? 1.0 : 0.65;
    const a = 0.25 + rnd() * 0.6;
    c.globalAlpha = a;
    c.fillStyle = m > 0.96 ? '#dce8ff' : '#9fb6d8';
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    if (r > 1.2){
      c.globalAlpha = a * 0.18;
      c.beginPath(); c.arc(x, y, r * 3.2, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
}

// ═══════════════ WEBGL ═══════════════
const glCanvas = document.getElementById('glcanvas');
const gl = glCanvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false })
        || glCanvas.getContext('experimental-webgl', { alpha: true });

const VSH = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// Шейдер считает только диск планеты и ореол вокруг него; всё остальное
// отбрасывается (звёзды лежат отдельным статичным слоем снизу).
const FSH = `
precision highp float;
uniform vec3  uView;      // cx, cy (GL-координаты), R в px
uniform mat3  uMinv;      // view -> world
uniform sampler2D uTex;   // текстура всего мира
uniform sampler2D uDet;   // детальная текстура видимого окна
uniform vec4  uDetRect;   // loMin, laMin, loSpan, laSpan (градусы)
uniform float uDetOn;

const float R2D = 57.29577951;

void main(){
  vec2 q = (gl_FragCoord.xy - uView.xy) / uView.z;
  float d = length(q);
  float aa = 1.6 / uView.z;

  vec3  atm  = vec3(0.22, 0.52, 1.0);
  float halo = exp(-max(d - 1.0, 0.0) * 7.5) * 0.34;

  if (d < 1.0 + aa){
    float z = sqrt(max(1.0 - d * d, 0.0));
    vec3 n = vec3(q, z);
    vec3 w = uMinv * n;
    float lon = atan(w.x, w.z);
    float pol = acos(clamp(w.y, -1.0, 1.0));
    vec3 tex = texture2D(uTex, vec2(lon / 6.28318530718 + 0.5, pol / 3.14159265359)).rgb;

    // Вблизи общая текстура не тянет по разрешению, поэтому поверх неё
    // подмешивается окно, отрисованное только для видимого участка.
    if (uDetOn > 0.5){
      float loD = lon * R2D;
      float laD = 90.0 - pol * R2D;
      float dl = mod(loD - uDetRect.x + 540.0, 360.0) - 180.0;
      vec2 duv = vec2(dl / uDetRect.z, (uDetRect.y + uDetRect.w - laD) / uDetRect.w);
      vec2 e = min(duv, 1.0 - duv);
      float m = step(0.0, e.x) * step(0.0, e.y) * smoothstep(0.0, 0.035, min(e.x, e.y));
      tex = mix(tex, texture2D(uDet, duv).rgb, m);
    }

    // мягкий свет + лимбовое затемнение
    vec3 L = normalize(vec3(-0.42, 0.34, 0.84));
    float diff = 0.72 + 0.40 * max(dot(n, L), 0.0);
    float rim = pow(1.0 - z, 3.0);
    vec3 col = tex * diff + atm * rim * 0.38;

    float m2 = smoothstep(1.0 + aa, 1.0 - aa, d);
    gl_FragColor = vec4(mix(atm, col, m2), max(m2, halo));
  } else {
    if (halo < 0.004) discard;
    gl_FragColor = vec4(atm, halo);
  }
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

let prog, uni = {}, tex, detTex;
function initGL(){
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  for (const name of ['uView','uMinv','uTex','uDet','uDetRect','uDetOn'])
    uni[name] = gl.getUniformLocation(prog, name);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.uniform1i(uni.uTex, 0);

  // Детальная текстура работает только на приближении, там всегда растяжение,
  // а не сжатие — мипмапы ей не нужны, и мы экономим на их построении.
  detTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, detTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.uniform1i(uni.uDet, 1);
  gl.uniform1f(uni.uDetOn, 0);
  gl.activeTexture(gl.TEXTURE0);
}

function uploadTexture(){
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  const ext = gl.getExtension('EXT_texture_filter_anisotropic');
  if (ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT,
    Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
}

// ═══════════════ СОСТОЯНИЕ КАМЕРЫ ═══════════════
const inputEl = document.getElementById('input');
const dpr = Math.min(window.devicePixelRatio || 1, 2);

let W = 0, H = 0;             // CSS-пиксели
let ry = 0.55, rx = 0.42;     // текущие углы
let ty = 0.55, tx = 0.42;     // целевые углы
let R = 100, tR = 100;        // радиус глобуса, px
let baseR = 100;
let autoRot = true;
let vy = 0, vx = 0;           // инерция
let dirty = true;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  glCanvas.width = W * dpr; glCanvas.height = H * dpr;
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  drawStarfield(W, H, dpr);
  const nb = Math.min(W, H) * 0.40;
  if (baseR === 100){ R = tR = nb; }
  baseR = nb;
  detRect = null;
  dirty = true;
}
window.addEventListener('resize', resize);

// view = M · world;  M = Rx(rx) · Ry(ry)
function viewMatrix(){
  const ca = Math.cos(ry), sa = Math.sin(ry);
  const cb = Math.cos(rx), sb = Math.sin(rx);
  return {
    r1: [ca, 0, sa],
    r2: [sb * sa, cb, -sb * ca],
    r3: [-cb * sa, sb, cb * ca],
  };
}
// обратная проекция: экран -> lat/lon (null вне сферы)
function unproject(mx, my, M){
  const qx = (mx - W/2) / R, qy = -(my - H/2) / R;
  const d2 = qx*qx + qy*qy;
  if (d2 > 1) return null;
  const qz = Math.sqrt(1 - d2);
  const wx = M.r1[0]*qx + M.r2[0]*qy + M.r3[0]*qz;
  const wy = M.r1[1]*qx + M.r2[1]*qy + M.r3[1]*qz;
  const wz = M.r1[2]*qx + M.r2[2]*qy + M.r3[2]*qz;
  return { lat: Math.asin(Math.max(-1, Math.min(1, wy))) / DEG, lon: Math.atan2(wx, wz) / DEG };
}

// ═══════════════ ДЕТАЛЬНАЯ ТЕКСТУРА ═══════════════
// Одна текстура на весь глобус не может быть резкой на сильном приближении:
// 4096 px на 360° — это ~10 км в пикселе. Поэтому вблизи поверх неё кладётся
// окно, отрисованное только для видимого участка, — то же качество, но
// в десяток раз плотнее. Пересобирается только когда вид устоялся.
let detRect = null;
let detBusy = false;

function detailWanted(){ return R > baseR * 1.6; }

function detailSpan(){
  const halfDiag = 0.5 * Math.hypot(W, H);
  const halfAng = Math.asin(Math.min(1, halfDiag / R)) / DEG;
  return Math.min(160, Math.max(3, halfAng * 2 * 1.25));
}

function detailStale(){
  if (!detailWanted()) return !!detRect;
  const ll = unproject(W/2, H/2, viewMatrix());
  if (!ll) return false;
  if (!detRect) return true;
  const span = detailSpan();
  if (Math.abs(span - detRect.laSpan) > detRect.laSpan * 0.3) return true;
  let dlo = ll.lon - detRect.loC;
  dlo = ((dlo + 540) % 360) - 180;
  if (Math.abs(dlo) > detRect.loSpan * 0.18) return true;
  if (Math.abs(ll.lat - detRect.laC) > detRect.laSpan * 0.18) return true;
  return false;
}

function updateDetail(){
  if (detBusy) return;
  if (!detailWanted()){
    if (detRect){ detRect = null; gl.uniform1f(uni.uDetOn, 0); dirty = true; }
    return;
  }
  const ll = unproject(W/2, H/2, viewMatrix());
  if (!ll) return;
  detBusy = true;

  const laSpan = detailSpan();
  // у полюсов та же картинка занимает куда больше градусов долготы
  const loSpan = Math.min(170, laSpan / Math.max(0.18, Math.cos(ll.lat * DEG)));
  const rect = {
    loMin: ll.lon - loSpan / 2, loSpan,
    laMin: Math.max(-90, Math.min(90 - laSpan, ll.lat - laSpan / 2)), laSpan,
    loC: ll.lon, laC: ll.lat,
  };
  const h = Math.max(256, Math.round(DET_SIZE * laSpan / loSpan));
  detCanvas.width = DET_SIZE; detCanvas.height = h;
  paintMap(detCanvas.getContext('2d'), DET_SIZE, h, rect, selectedKey);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, detTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, detCanvas);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform4f(uni.uDetRect, rect.loMin, rect.laMin, rect.loSpan, rect.laSpan);
  gl.uniform1f(uni.uDetOn, 1);

  detRect = rect;
  detBusy = false;
  dirty = true;
}

// ═══════════════ ЛЕГЕНДА И СПРАВКА ═══════════════
const legend = document.getElementById('legend');
const legendBody = document.getElementById('legendBody');
const fcard = document.getElementById('fcard');
let selectedKey = null;

for (const f of FACTIONS){
  const it = document.createElement('div');
  it.className = 'l-item';
  it.style.setProperty('--fc', f.col);
  it.dataset.key = f.key;
  it.innerHTML = `<div class="l-dot"></div><div class="l-name">${f.name}</div>`;
  it.addEventListener('click', () => select(selectedKey === f.key ? null : f.key, true));
  legendBody.appendChild(it);
}
document.getElementById('legendHead').addEventListener('click', () => {
  legend.classList.toggle('collapsed');
  document.getElementById('legendToggle').textContent = legend.classList.contains('collapsed') ? '+' : '–';
});
if (window.innerWidth <= 700){
  legend.classList.add('collapsed');
  document.getElementById('legendToggle').textContent = '+';
}
document.getElementById('fcClose').addEventListener('click', () => select(null));

function openCard(f){
  fcard.style.setProperty('--fc', f.col);
  document.getElementById('fcName').textContent = f.name;
  const lead = document.getElementById('fcLead');
  const leader = document.getElementById('fcLeader');
  leader.textContent = f.leader || '';
  lead.style.display = leader.style.display = f.leader ? '' : 'none';
  document.getElementById('fcIdeo').textContent = f.ideo || '';
  fcard.classList.add('open');
}

function shortestAngle(from, to){
  let d = (to - from) % (2 * Math.PI);
  if (d >  Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return from + d;
}
function flyToLL(lat, lon, minZoom){
  ty = shortestAngle(ry, -lon * DEG);
  tx = Math.max(-1.35, Math.min(1.35, lat * DEG));
  if (minZoom && tR < minZoom) tR = minZoom;
  autoRot = false;
  dirty = true;
}

function refreshTexture(key){
  if (refreshTexture._last === key) return;
  refreshTexture._last = key;
  buildTexture(key);
  uploadTexture();
  detRect = null;   // детальное окно тоже устарело
  dirty = true;
}

function select(key, fly){
  const f = key ? FACTIONS.find(x => x.key === key) : null;
  selectedKey = f ? key : null;
  legendBody.querySelectorAll('.l-item').forEach(el =>
    el.classList.toggle('active', el.dataset.key === selectedKey));
  if (f){
    openCard(f);
    if (fly) flyToLL(f.clat, f.clon, baseR * 1.5);
  } else {
    fcard.classList.remove('open');
  }
  refreshTexture(selectedKey);
}

// ═══════════════ МАСШТАБНАЯ ЛИНЕЙКА ═══════════════
const scaleKm = document.getElementById('scaleKm');
const scaleRule = document.getElementById('scaleRule');
const altValue = document.getElementById('scaleAltValue');
const FOV_HALF = 22.5 * DEG;   // условный полуугол обзора «камеры»

function fmtKm(km){
  return km >= 1000 ? (km / 1000).toFixed(km >= 10000 ? 0 : 1).replace('.', ',') + ' ТЫС КМ'
                    : Math.round(km) + ' КМ';
}
function updateScale(){
  // Проекция ортографическая, поэтому «высота» — это то удаление, с которого
  // Земля видна под тем же углом при полуугле обзора FOV_HALF.
  const ang = Math.atan2(R * Math.tan(FOV_HALF), H / 2);
  const alt = Math.max(0, R_EARTH / Math.sin(ang) - R_EARTH);

  const kmPerPx = R_EARTH / R;   // в центре диска
  let best = 100;
  for (const km of [10, 25, 50, 100, 200, 300, 500, 1000, 2000, 3000, 5000, 10000]){
    best = km;
    if (km / kmPerPx >= 60) break;
  }
  scaleRule.style.width = Math.round(best / kmPerPx) + 'px';
  scaleKm.textContent = fmtKm(best);
  altValue.textContent = fmtKm(alt);
}

// ═══════════════ ГЛАВНЫЙ ЦИКЛ ═══════════════
// Кадр рисуется, только когда что-то реально меняется: на статичном глобусе
// GPU простаивает вместо того, чтобы бесконечно перерисовывать одно и то же.
function animating(){
  return autoRot
      || Math.abs(vy) > 1e-5 || Math.abs(vx) > 1e-5
      || Math.abs(ty - ry) > 1e-4 || Math.abs(tx - rx) > 1e-4
      || Math.abs(tR - R)  > 0.05;
}

function frame(){
  if (autoRot) ty += 0.0032;
  if (Math.abs(vy) > 1e-5 || Math.abs(vx) > 1e-5){
    ty += vy; tx += vx;
    vy *= 0.94; vx *= 0.94;
    tx = Math.max(-1.35, Math.min(1.35, tx));
  }
  ry += (ty - ry) * 0.09;
  rx += (tx - rx) * 0.09;
  R  += (tR - R) * 0.12;

  const moving = animating();
  if (dirty || moving){
    const M = viewMatrix();
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform3f(uni.uView, W/2 * dpr, glCanvas.height - H/2 * dpr, R * dpr);
    // uMinv = M^T, column-major => столбцы = строки M
    gl.uniformMatrix3fv(uni.uMinv, false, new Float32Array([
      M.r1[0], M.r1[1], M.r1[2],
      M.r2[0], M.r2[1], M.r2[2],
      M.r3[0], M.r3[1], M.r3[2],
    ]));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    updateScale();
    dirty = false;
  }
  // детальное окно пересобираем только когда вид устоялся,
  // иначе на каждом кадре перетаскивания шла бы полная перерисовка
  if (!moving && !dragging && detailStale()) updateDetail();
  requestAnimationFrame(frame);
}

// ═══════════════ ВВОД ═══════════════
const pointers = new Map();
let dragging = false, dragDist = 0, lastX = 0, lastY = 0, pinch0 = 0, pinchR0 = 0;
let lastMoveT = 0, lastDX = 0, lastDY = 0;

function speed(){ return 0.0048 * Math.min(W, H) / R; }
function clampR(r){ return Math.max(baseR * 0.45, Math.min(baseR * 9, r)); }

inputEl.addEventListener('pointerdown', e => {
  inputEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){
    dragging = true; dragDist = 0;
    lastX = e.clientX; lastY = e.clientY;
    vy = vx = 0;
    autoRot = false;
    inputEl.classList.add('dragging');
  } else if (pointers.size === 2){
    const pts = [...pointers.values()];
    pinch0 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchR0 = tR;
    dragging = false;
  }
  dirty = true;
});

inputEl.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinch0 > 0) tR = clampR(pinchR0 * d / pinch0);
    dirty = true;
    return;
  }
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const sp = speed();
    ty += dx * sp; tx += dy * sp;
    tx = Math.max(-1.35, Math.min(1.35, tx));
    dragDist += Math.abs(dx) + Math.abs(dy);
    lastDX = dx * sp; lastDY = dy * sp; lastMoveT = performance.now();
    lastX = e.clientX; lastY = e.clientY;
    dirty = true;
    return;
  }
  if (pointers.size === 0 && e.pointerType === 'mouse'){
    const rect = inputEl.getBoundingClientRect();
    const ll = unproject(e.clientX - rect.left, e.clientY - rect.top, viewMatrix());
    inputEl.classList.toggle('pointing', !!(ll && factionAt(ll.lat, ll.lon)));
  }
});

inputEl.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (dragging && pointers.size === 0){
    dragging = false;
    inputEl.classList.remove('dragging');
    if (performance.now() - lastMoveT < 60 && dragDist > 6){ vy = lastDX; vx = lastDY; }
    if (dragDist < 6){
      const rect = inputEl.getBoundingClientRect();
      const ll = unproject(e.clientX - rect.left, e.clientY - rect.top, viewMatrix());
      const f = ll ? factionAt(ll.lat, ll.lon) : null;
      select(f ? f.key : null, false);
    }
  }
  if (pointers.size < 2) pinch0 = 0;
  dirty = true;
});
inputEl.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  dragging = false;
  inputEl.classList.remove('dragging');
});

inputEl.addEventListener('wheel', e => {
  e.preventDefault();
  tR = clampR(tR * (e.deltaY > 0 ? 0.9 : 1.11));
  dirty = true;
}, { passive: false });

// ═══════════════ СТАРТ ═══════════════
function start(){
  if (!gl){
    document.querySelector('.load-text').textContent = 'ERROR: WEBGL UNAVAILABLE';
    return;
  }
  initGL();
  resize();
  R = tR = baseR;
  // Считаем в ФИЗИЧЕСКИХ пикселях: у телефона ширина в CSS-пикселях ~390,
  // но плотность втрое выше, и текстура на 2048 давала заметное мыло.
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
  const shortPx = Math.min(screen.width, screen.height) * (window.devicePixelRatio || 1);
  texSize = Math.min(shortPx < 700 ? 2048 : 4096, maxTex);
  buildTexture(null);
  uploadTexture();
  updateScale();
  requestAnimationFrame(frame);
  const loader = document.getElementById('loader');
  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 900);
}

// ═══════════════ ВОРОТА ДОСТУПА ═══════════════
// Мягкий клиентский замок: пропускает по коду доступа, чтобы страницу
// пока видела только владелица. В исходнике хранится только SHA-256-хэш
// кода, не сам код. Это не криптозащита — определённый посетитель может
// обойти любой клиентский замок, — но случайных гостей он не пустит.
// Чтобы сменить код: посчитайте новый хэш и замените строку ниже.
//   в терминале:  printf '%s' 'новый-код' | sha256sum
const ACCESS_HASH = 'c5bb4ef4cf1c3e749f1bc451c824755fa16f0d7b9ca636f38c1284009076e3b4';
const GATE_KEY = 'dw_globe_access';

async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlockAndStart(){
  const g = document.getElementById('gate');
  if (g) g.remove();
  start();
}

(function gate(){
  const gateEl = document.getElementById('gate');
  if (localStorage.getItem(GATE_KEY) === ACCESS_HASH){
    unlockAndStart();
    return;
  }
  gateEl.style.display = 'flex';
  const form  = document.getElementById('gateForm');
  const input = document.getElementById('gateInput');
  const err   = document.getElementById('gateErr');
  setTimeout(() => input.focus(), 60);

  if (!(window.crypto && crypto.subtle)){
    err.textContent = 'ОТКРОЙТЕ СТРАНИЦУ ПО HTTPS';
    input.disabled = true;
    return;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const val = input.value.trim();
    if (!val) return;
    let h;
    try { h = await sha256hex(val); } catch(_) { return; }
    if (h === ACCESS_HASH){
      localStorage.setItem(GATE_KEY, ACCESS_HASH);
      gateEl.classList.add('ok');
      setTimeout(unlockAndStart, 380);
    } else {
      err.textContent = 'НЕВЕРНЫЙ КОД ДОСТУПА';
      gateEl.classList.add('shake');
      setTimeout(() => gateEl.classList.remove('shake'), 420);
      input.value = '';
      input.focus();
    }
  });
})();

})();
</script>
